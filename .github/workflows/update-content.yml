name: Monthly Content Refresh

on:
  schedule:
    - cron: '0 9 1 * *'   # 9am UTC on the 1st of every month
  workflow_dispatch:        # allow manual trigger from the GitHub UI

jobs:
  update-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the commit back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Run content updater
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node update-content.js
        continue-on-error: true   # don't fail the workflow if Claude errors

      - name: Commit and push if content changed
        run: |
          git config user.name "AQL Content Bot"
          git config user.email "content-bot@users.noreply.github.com"
          if ! git diff --quiet content.js; then
            git add content.js
            git commit -m "chore: auto-refresh learning content $(date +%Y-%m)"
            git push
            echo "✅ New content committed and pushed — Vercel will redeploy automatically."
          else
            echo "ℹ️  No changes to content.js — skipping commit."
          fi
